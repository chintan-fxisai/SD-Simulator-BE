[project]
name = "sd-simulator-be"
version = "0.1.0"
description = "FastAPI backend for SD Simulator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",
    "asyncmy>=0.2.9",
    "bcrypt>=4.1.3",
    "fastapi>=0.111.0",
    "pydantic-settings>=2.3.4",
    "pydantic[email]>=2.7.4",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "pymysql>=1.1.1",
    "sqlalchemy[asyncio]>=2.0.31",
    "structlog>=24.2.0",
    "uvicorn[standard]>=0.30.1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
